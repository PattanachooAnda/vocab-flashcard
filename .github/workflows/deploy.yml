name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # ให้ run ด้วยมือได้จาก GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # สร้าง dist/ แยก แล้วเขียน Firebase config จริงลงไป (upload จาก dist/ ไม่ใช่ repo root)
      - name: Build dist with Firebase config
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL:        ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          [ -z "$FIREBASE_DATABASE_URL" ] && echo "ERROR: FIREBASE_DATABASE_URL secret not set" && exit 1
          mkdir dist
          rsync -a --exclude='.git' --exclude='dist' . dist/
          cat > dist/firebase-config.js << CFGEOF
          window.FIREBASE_CFG = {
            apiKey:            "${FIREBASE_API_KEY}",
            authDomain:        "${FIREBASE_AUTH_DOMAIN}",
            databaseURL:       "${FIREBASE_DATABASE_URL}",
            projectId:         "${FIREBASE_PROJECT_ID}",
            storageBucket:     "${FIREBASE_STORAGE_BUCKET}",
            messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
            appId:             "${FIREBASE_APP_ID}"
          };
          CFGEOF
          echo "dist/firebase-config.js written ($(wc -c < dist/firebase-config.js) bytes)"
          echo "--- first line of dist/firebase-config.js ---"
          head -1 dist/firebase-config.js
          echo "--- files in dist/ ---"
          ls dist/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

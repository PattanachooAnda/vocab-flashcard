name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # ให้ run ด้วยมือได้จาก GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # สร้าง firebase-config.js จาก GitHub Secrets (ไม่ถูก commit ลง repo)
      - name: Inject Firebase config from secrets
        env:
          FIREBASE_API_KEY:            ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:        ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL:       ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID:         ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:     ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:             ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cat > firebase-config.js << ENDOFFILE
          window.FIREBASE_CFG = {
            apiKey:            "${FIREBASE_API_KEY}",
            authDomain:        "${FIREBASE_AUTH_DOMAIN}",
            databaseURL:       "${FIREBASE_DATABASE_URL}",
            projectId:         "${FIREBASE_PROJECT_ID}",
            storageBucket:     "${FIREBASE_STORAGE_BUCKET}",
            messagingSenderId: "${FIREBASE_MESSAGING_SENDER_ID}",
            appId:             "${FIREBASE_APP_ID}"
          };
          ENDOFFILE
          echo "firebase-config.js created"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'           # อัพโหลดทั้ง folder รวม firebase-config.js ที่เพิ่งสร้าง

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

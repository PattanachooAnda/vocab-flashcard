name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # ให้ run ด้วยมือได้จาก GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Inject Firebase config จาก GitHub Secrets ลงใน index.html โดยตรง (ไม่ต้องพึ่งไฟล์แยก)
      - name: Inject Firebase config from secrets
        env:
          FIREBASE_API_KEY:             ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN:         ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_DATABASE_URL:        ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PROJECT_ID:          ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET:      ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID:              ${{ secrets.FIREBASE_APP_ID }}
        run: |
          cat > /tmp/inject_firebase.py << 'PYEOF'
          import os, sys
          keys = ['FIREBASE_API_KEY','FIREBASE_AUTH_DOMAIN','FIREBASE_DATABASE_URL',
                  'FIREBASE_PROJECT_ID','FIREBASE_STORAGE_BUCKET','FIREBASE_MESSAGING_SENDER_ID','FIREBASE_APP_ID']
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
              print(f"ERROR: Missing GitHub secrets: {missing}", file=sys.stderr)
              sys.exit(1)
          e = {k: os.environ[k] for k in keys}
          cfg = (
              '<script>window.FIREBASE_CFG={'
              f'apiKey:"{e["FIREBASE_API_KEY"]}",'
              f'authDomain:"{e["FIREBASE_AUTH_DOMAIN"]}",'
              f'databaseURL:"{e["FIREBASE_DATABASE_URL"]}",'
              f'projectId:"{e["FIREBASE_PROJECT_ID"]}",'
              f'storageBucket:"{e["FIREBASE_STORAGE_BUCKET"]}",'
              f'messagingSenderId:"{e["FIREBASE_MESSAGING_SENDER_ID"]}",'
              f'appId:"{e["FIREBASE_APP_ID"]}"'
              '};</script>'
          )
          with open('index.html', 'r', encoding='utf-8') as f:
              content = f.read()
          if '<!-- __FIREBASE_CONFIG__ -->' not in content:
              print("ERROR: placeholder not found in index.html", file=sys.stderr)
              sys.exit(1)
          content = content.replace('<!-- __FIREBASE_CONFIG__ -->', cfg)
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print("Firebase config injected successfully")
          PYEOF
          python3 /tmp/inject_firebase.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

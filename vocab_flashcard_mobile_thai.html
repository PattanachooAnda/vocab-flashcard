
<style>

.nav-btn{padding:11px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);font-family:'Sarabun',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .15s}

</style>

<script>
const ALL = [
  {en:"Absent",ph:"/ˈæb.sənt/",th:"ขาด / ไม่อยู่",ex:"He was absent from school today.",exth:"เขาขาดเรียนวันนี้",lv:"ม.1",cat:"ชีวิตประจำวัน"},
  {en:"Polite",ph:"/pəˈlaɪt/",th:"สุภาพ / มีมารยาท",ex:"She is always polite to everyone.",exth:"เธอสุภาพกับทุกคนเสมอ",lv:"ม.1",cat:"ชีวิตประจำวัน"},
  {en:"Curious",ph:"/ˈkjʊər.i.əs/",th:"อยากรู้อยากเห็น",ex:"Children are naturally curious.",exth:"เด็กๆ มักอยากรู้อยากเห็นตามธรรมชาติ",lv:"ม.1",cat:"ชีวิตประจำวัน"},
  {en:"Schedule",ph:"/ˈʃed.juːl/",th:"ตารางเวลา / กำหนดการ",ex:"Check the schedule before you go.",exth:"ตรวจตารางเวลาก่อนไป",lv:"ม.2",cat:"ชีวิตประจำวัน"},
  {en:"Responsible",ph:"/rɪˈspɒn.sɪ.bəl/",th:"มีความรับผิดชอบ",ex:"Be responsible for your own actions.",exth:"รับผิดชอบต่อการกระทำของตัวเอง",lv:"ม.2",cat:"ชีวิตประจำวัน"},
  {en:"Anxious",ph:"/ˈæŋk.ʃəs/",th:"วิตกกังวล / กระวนกระวาย",ex:"She felt anxious before the exam.",exth:"เธอรู้สึกวิตกกังวลก่อนสอบ",lv:"ม.2",cat:"อารมณ์"},
  {en:"Generous",ph:"/ˈdʒen.ər.əs/",th:"ใจกว้าง / เอื้อเฟื้อ",ex:"He is generous with his time and money.",exth:"เขาเอื้อเฟื้อทั้งเวลาและเงินทอง",lv:"ม.3",cat:"ชีวิตประจำวัน"},
  {en:"Efficient",ph:"/ɪˈfɪʃ.ənt/",th:"มีประสิทธิภาพ",ex:"A good worker must be efficient.",exth:"พนักงานที่ดีต้องมีประสิทธิภาพ",lv:"ม.3",cat:"การทำงาน"},
  {en:"Grateful",ph:"/ˈɡreɪt.fəl/",th:"รู้สึกขอบคุณ / กตัญญู",ex:"I am grateful for your help.",exth:"ฉันรู้สึกขอบคุณสำหรับความช่วยเหลือ",lv:"ม.3",cat:"อารมณ์"},
  {en:"Negotiate",ph:"/nɪˈɡəʊ.ʃi.eɪt/",th:"เจรจา / ต่อรอง",ex:"They negotiated a new contract.",exth:"พวกเขาเจรจาสัญญาฉบับใหม่",lv:"ม.4",cat:"การทำงาน"},
  {en:"Volunteer",ph:"/ˌvɒl.ənˈtɪər/",th:"อาสาสมัคร / จิตอาสา",ex:"She volunteers at the local hospital.",exth:"เธออาสาทำงานที่โรงพยาบาลท้องถิ่น",lv:"ม.4",cat:"สังคม"},
  {en:"Environment",ph:"/ɪnˈvaɪ.rən.mənt/",th:"สิ่งแวดล้อม",ex:"We must protect the environment.",exth:"เราต้องปกป้องสิ่งแวดล้อม",lv:"ม.4",cat:"สังคม"},
  {en:"Sustainable",ph:"/səˈsteɪ.nə.bəl/",th:"ยั่งยืน / คงทน",ex:"We need sustainable energy sources.",exth:"เราต้องการแหล่งพลังงานที่ยั่งยืน",lv:"ม.5",cat:"สังคม"},
  {en:"Inspire",ph:"/ɪnˈspaɪər/",th:"สร้างแรงบันดาลใจ",ex:"Great leaders inspire others to act.",exth:"ผู้นำที่ดีสร้างแรงบันดาลใจให้ผู้อื่น",lv:"ม.5",cat:"การทำงาน"},
  {en:"Consequence",ph:"/ˈkɒn.sɪ.kwəns/",th:"ผลที่ตามมา / ผลลัพธ์",ex:"Think about the consequences of your actions.",exth:"คิดถึงผลที่ตามมาจากการกระทำของคุณ",lv:"ม.5",cat:"ชีวิตประจำวัน"},
  {en:"Accomplish",ph:"/əˈkʌm.plɪʃ/",th:"บรรลุ / ประสบความสำเร็จ",ex:"She accomplished all her goals.",exth:"เธอบรรลุเป้าหมายทั้งหมด",lv:"ม.5",cat:"การทำงาน"},
  {en:"Competent",ph:"/ˈkɒm.pɪ.tənt/",th:"มีความสามารถ / เชี่ยวชาญ",ex:"A competent officer handles problems well.",exth:"เจ้าหน้าที่ที่มีความสามารถจัดการปัญหาได้ดี",lv:"ม.6",cat:"การทำงาน"},
  {en:"Transparent",ph:"/trænsˈpær.ənt/",th:"โปร่งใส / ชัดเจน",ex:"The government should be transparent.",exth:"รัฐบาลควรมีความโปร่งใส",lv:"ม.6",cat:"สังคม"},
  {en:"Integrity",ph:"/ɪnˈteɡ.rɪ.ti/",th:"ความซื่อสัตย์ / ความมีคุณธรรม",ex:"Public officers must have integrity.",exth:"ข้าราชการต้องมีความซื่อสัตย์",lv:"ม.6",cat:"ราชการ"},
  {en:"Authority",ph:"/ɔːˈθɒr.ɪ.ti/",th:"อำนาจ / หน่วยงานที่มีอำนาจ",ex:"The authority approved the new law.",exth:"หน่วยงานอนุมัติกฎหมายใหม่",lv:"ม.6",cat:"ราชการ"},
  {en:"Regulation",ph:"/ˌreɡ.jʊˈleɪ.ʃən/",th:"กฎระเบียบ / ข้อบังคับ",ex:"All staff must follow the regulations.",exth:"พนักงานทุกคนต้องปฏิบัติตามกฎระเบียบ",lv:"ม.6",cat:"ราชการ"},
  {en:"Petition",ph:"/pəˈtɪʃ.ən/",th:"คำร้อง / ยื่นคำร้อง",ex:"Citizens signed a petition for change.",exth:"ประชาชนเซ็นคำร้องเรียกร้องการเปลี่ยนแปลง",lv:"ม.6",cat:"ราชการ"},
  {en:"Emphasize",ph:"/ˈem.fə.saɪz/",th:"เน้น / ให้ความสำคัญ",ex:"The teacher emphasized the key points.",exth:"ครูเน้นย้ำประเด็นสำคัญ",lv:"ม.5",cat:"การทำงาน"},
  {en:"Hesitate",ph:"/ˈhez.ɪ.teɪt/",th:"ลังเล / ชักช้า",ex:"Don't hesitate to ask for help.",exth:"อย่าลังเลที่จะขอความช่วยเหลือ",lv:"ม.4",cat:"อารมณ์"},
  {en:"Acknowledge",ph:"/əkˈnɒl.ɪdʒ/",th:"ยอมรับ / รับทราบ",ex:"She acknowledged her mistake.",exth:"เธอยอมรับความผิดพลาดของตัวเอง",lv:"ม.5",cat:"ชีวิตประจำวัน"},
  {en:"Discipline",ph:"/ˈdɪs.ɪ.plɪn/",th:"วินัย / ระเบียบวินัย",ex:"Discipline is key to success.",exth:"วินัยคือกุญแจสู่ความสำเร็จ",lv:"ม.3",cat:"ชีวิตประจำวัน"},
  {en:"Prioritize",ph:"/praɪˈɒr.ɪ.taɪz/",th:"จัดลำดับความสำคัญ",ex:"Prioritize your most important tasks first.",exth:"จัดลำดับงานสำคัญที่สุดก่อน",lv:"ม.6",cat:"การทำงาน"},
  {en:"Prejudice",ph:"/ˈpredʒ.ʊ.dɪs/",th:"อคติ / ความลำเอียง",ex:"We should act without prejudice.",exth:"เราควรปฏิบัติโดยปราศจากอคติ",lv:"ม.6",cat:"สังคม"},
  {en:"Citizen",ph:"/ˈsɪt.ɪ.zən/",th:"พลเมือง / ประชาชน",ex:"Every citizen has rights and duties.",exth:"พลเมืองทุกคนมีสิทธิและหน้าที่",lv:"ม.4",cat:"ราชการ"},
  {en:"Welfare",ph:"/ˈwel.feər/",th:"สวัสดิภาพ / ความเป็นอยู่ที่ดี",ex:"The government cares about public welfare.",exth:"รัฐบาลดูแลสวัสดิภาพของประชาชน",lv:"ม.5",cat:"ราชการ"},
];

const CATS = ["ทั้งหมด","ชีวิตประจำวัน","อารมณ์","การทำงาน","สังคม","ราชการ"];
let activeCat = "ทั้งหมด";
let deck = [], idx = 0, known = 0, notKnown = 0, flipped = false, done = false;

function filtered(){ return activeCat === "ทั้งหมด" ? [...ALL] : ALL.filter(w=>w.cat===activeCat); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a; }

function buildCats(){
  const c = document.getElementById('cats');
  CATS.forEach(name=>{
    const b = document.createElement('button');
    b.className = 'cat-btn' + (name===activeCat?' active':'');
    b.textContent = name;
    b.onclick = ()=>{ activeCat=name; document.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); restart(); };
    c.appendChild(b);
  });
}

function render(){
  if(idx >= deck.length){ showDone(); return; }
  const w = deck[idx];
  document.getElementById('cEn').textContent = w.en;
  document.getElementById('cPh').textContent = w.ph;
  document.getElementById('cLv').textContent = w.lv + ' · ' + w.cat;
  document.getElementById('cTh').textContent = w.th;
  document.getElementById('cEx').textContent = '"' + w.ex + '"';
  document.getElementById('cExTh').textContent = w.exth;
  document.getElementById('cardInner').classList.remove('flipped');
  document.getElementById('revealBtn').classList.remove('hidden');
  document.getElementById('resultRow').classList.add('hidden');
  flipped = false;
  const pct = Math.round(idx / deck.length * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = (idx+1) + ' / ' + deck.length;
  document.getElementById('progPct').textContent = pct + '%';
  document.getElementById('stK').textContent = known;
  document.getElementById('stD').textContent = notKnown;
  document.getElementById('stL').textContent = deck.length - idx;
  document.getElementById('doneBox').classList.add('hidden');
  document.getElementById('cardWrap').classList.remove('hidden');
}

function flip(){
  if(done) return;
  if(!flipped){
    flipped = true;
    document.getElementById('cardInner').classList.add('flipped');
    document.getElementById('revealBtn').classList.add('hidden');
    document.getElementById('resultRow').classList.remove('hidden');
  } else {
    flipped = false;
    document.getElementById('cardInner').classList.remove('flipped');
    document.getElementById('revealBtn').classList.remove('hidden');
    document.getElementById('resultRow').classList.add('hidden');
  }
}

function mark(k){ if(k) known++; else notKnown++; idx++; render(); }
function go(d){ idx = Math.max(0, Math.min(deck.length-1, idx+d)); render(); }
function shuffleAll(){ deck = shuffle(filtered()); idx=0; known=0; notKnown=0; done=false; render(); }
function showDone(){
  done = true;
  document.getElementById('cardWrap').classList.add('hidden');
  document.getElementById('revealBtn').classList.add('hidden');
  document.getElementById('resultRow').classList.add('hidden');
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('progLabel').textContent = deck.length + ' / ' + deck.length;
  document.getElementById('progPct').textContent = '100%';
  document.getElementById('stK').textContent = known;
  document.getElementById('stD').textContent = notKnown;
  document.getElementById('stL').textContent = 0;
  document.getElementById('doneSub').textContent = 'รู้แล้ว ' + known + ' คำ · ยังต้องฝึกอีก ' + notKnown + ' คำ จาก ' + deck.length + ' คำทั้งหมด';
  document.getElementById('doneBox').classList.remove('hidden');
}
function restart(){ deck=shuffle(filtered()); idx=0; known=0; notKnown=0; done=false; render(); }

buildCats();
restart();
</script>
